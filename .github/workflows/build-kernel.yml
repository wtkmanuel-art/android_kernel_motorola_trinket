name: Compile KernelSU Next for Sofia

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3
        with:
          branch: android-10-release-qpe

      - name: Setup Environment & Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev git curl
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64-linux-android-4.9
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r383902 bionic-clang

      - name: Inject KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${{ github.workspace }}/bionic-clang/bin:${{ github.workspace }}/aarch64-linux-android-4.9/bin:$PATH"
          
          make O=out sofia_defconfig
          make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-android-

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: boot-ksu-next
          path: out/arch/arm64/boot/Image.gz-dtb
